[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/manjha"
  to = "/manjha/index.html"
  status = 200

[[redirects]]
  from = "/wedding"
  to = "/wedding/index.html"
  status = 200

[[redirects]]
  from = "/reception"
  to = "/reception/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
